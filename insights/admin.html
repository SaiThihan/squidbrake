<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Squidbrake Insights</title>
<style>
:root { --bg:#f6f6f4; --card:#fff; --ink:#18181b; --muted:#71717a; --line:#e4e4e7; --soft:#f4f4f5; --accent:#dc2626;
        --ok:#16a34a; --warn:#d97706; --info:#2563eb; --bar:#6366f1; }
@media (prefers-color-scheme: dark) { :root { --bg:#111114; --card:#1a1a1f; --ink:#f4f4f5; --muted:#a1a1aa; --line:#2e2e35;
        --soft:#232329; --accent:#ef4444; --ok:#22c55e; --warn:#f59e0b; --info:#60a5fa; --bar:#818cf8; } }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; }
main { max-width:1200px; margin:0 auto; padding:24px 16px 60px; }
header { display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:18px; }
.brand { font-weight:800; font-size:20px; } .brand span { color:var(--accent); } .brand small { color:var(--muted); font-weight:500; }
.spacer { flex:1; }
button, input, textarea { font:inherit; color:inherit; }
.btn { border:1px solid var(--line); background:var(--card); border-radius:9px; padding:7px 13px; cursor:pointer; }
.btn.primary { background:var(--ink); color:var(--bg); border-color:var(--ink); }
a { color:var(--info); } a.btn { color:var(--ink); text-decoration:none; display:inline-block; }
.cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-bottom:18px; }
.card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 16px; }
.card .k { color:var(--muted); font-size:13px; } .card .v { font-size:28px; font-weight:750; letter-spacing:-.02em; }
.panel { background:var(--card); border:1px solid var(--line); border-radius:12px; margin-bottom:18px; }
.panel h2 { font-size:16px; margin:0; padding:14px 16px; border-bottom:1px solid var(--line); display:flex; gap:8px; align-items:center; }
.table-wrap { overflow-x:auto; }
table { width:100%; border-collapse:collapse; min-width:900px; }
th, td { text-align:left; padding:11px 14px; border-top:1px solid var(--line); vertical-align:top; }
th { font-size:12px; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:.04em; border-top:0; }
td.num { font-variant-numeric:tabular-nums; }
.co { font-weight:650; } .sub { color:var(--muted); font-size:13px; }
.stage { display:inline-block; border-radius:999px; padding:2px 10px; font-size:12.5px; font-weight:650; white-space:nowrap; }
.s-active { background:color-mix(in srgb,var(--ok) 16%,transparent); color:var(--ok); }
.s-installed { background:color-mix(in srgb,var(--info) 16%,transparent); color:var(--info); }
.s-quiet, .s-opened { background:color-mix(in srgb,var(--warn) 16%,transparent); color:var(--warn); }
.s-sent, .s-left { background:var(--soft); color:var(--muted); }
.chip { display:inline-block; background:var(--soft); border-radius:6px; padding:1px 7px; margin:2px 3px 0 0; font-size:12.5px; }
.chip.r { font-family:ui-monospace,Consolas,monospace; font-size:12px; }
.spark { display:flex; align-items:flex-end; gap:2px; height:34px; }
.spark i { display:block; width:7px; background:var(--bar); border-radius:2px 2px 0 0; min-height:1px; opacity:.85; }
.mini { color:var(--muted); font-size:12.5px; margin-top:3px; }
.mini b { color:var(--ink); }
form.new { display:grid; grid-template-columns:2fr 2fr 3fr auto; gap:8px; padding:14px 16px; }
form.new input { border:1px solid var(--line); background:var(--bg); border-radius:9px; padding:8px 10px; }
.hosted-opt { grid-column:1 / -1; color:var(--muted); font-size:13.5px; }
.hosted-opt input { width:auto; margin:0 6px 0 0; vertical-align:-2px; }
.result { margin:0 16px 16px; padding:14px; border-radius:10px; background:var(--soft); display:none; }
.result textarea { width:100%; min-height:150px; border:1px solid var(--line); border-radius:8px; padding:10px; background:var(--card); }
.result .row { display:flex; gap:8px; margin-top:8px; flex-wrap:wrap; }
.empty { padding:30px 16px; color:var(--muted); text-align:center; }
.login { max-width:420px; margin:12vh auto; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:24px; }
.login input { width:100%; border:1px solid var(--line); background:var(--bg); border-radius:9px; padding:9px 11px; margin:10px 0; }
.err { color:var(--accent); min-height:1.2em; font-size:14px; }
.icon-btn { border:0; background:none; color:var(--muted); cursor:pointer; padding:2px 4px; }
.modal { position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:10; padding:0 16px; }
@media (max-width:720px) { form.new { grid-template-columns:1fr; } }
  tr.catches td { background: var(--bg, #fafafa); padding-top: 0 }
  tr.catches summary { cursor: pointer; font-size: 13px; padding: 6px 0 }
  table.inner { width: 100%; margin: 6px 0; font-size: 13px }
  table.inner th, table.inner td { padding: 4px 8px }
</style>
</head>
<body>
<main id="app"></main>
<script>
const app = document.getElementById("app");
const store = { get: () => { try { return localStorage.getItem("insightsKey") || ""; } catch { return ""; } },
                set: (v) => { try { v ? localStorage.setItem("insightsKey", v) : localStorage.removeItem("insightsKey"); } catch {} } };
let key = store.get();
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const api = async (path, opts = {}) => {
  const r = await fetch(path, { ...opts, headers: { "X-Admin-Key": key, "Content-Type": "application/json", ...(opts.headers || {}) } });
  if (r.status === 401) { store.set(""); key = ""; login("Please sign in again."); throw new Error("unauthorized"); }
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || r.statusText);
  return r.json();
};
const ago = (iso) => {
  if (!iso) return "never";
  const s = (Date.now() - new Date(iso).getTime()) / 1000;
  return s < 90 ? "just now" : s < 5400 ? `${Math.round(s / 60)} min ago` : s < 129600 ? `${Math.round(s / 3600)} h ago` : `${Math.round(s / 86400)} d ago`;
};
const STAGE = { "active": ["Active", "s-active"], "installed": ["Installed, no activity yet", "s-installed"],
  "quiet": ["Gone quiet", "s-quiet"], "opened link": ["Opened the link", "s-opened"], "link sent": ["Link sent", "s-sent"],
  "left": ["Left the pilot", "s-left"], "setting up": ["Setting up", "s-installed"], "keys taken": ["Took keys, not connected yet", "s-opened"],
  "setup failed": ["Setup failed", "s-quiet"], "deleting": ["Deleting", "s-left"] };

function login(msg = "") {
  app.innerHTML = `<div class="login"><div class="brand">Squid<span>brake</span> <small>Insights</small></div>
    <p class="sub">Your pilots, at a glance. Sign in with your password (the first time: the server key from the .env).</p>
    <form id="lf"><input id="lk" type="password" placeholder="Password" autocomplete="current-password" autofocus>
    <button class="btn primary" style="width:100%">Sign in</button><div class="err">${esc(msg)}</div></form></div>`;
  document.getElementById("lf").onsubmit = async (e) => {
    e.preventDefault();
    const r = await fetch("/v1/admin/login", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password: document.getElementById("lk").value }) });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) return login(d.detail || "Couldn't sign in.");
    key = d.token; store.set(key); load();
  };
}

function passwordDialog(first) {
  const box = document.createElement("div");
  box.className = "modal";
  box.innerHTML = `<form class="login" id="pf" style="margin:10vh auto">
    <div class="brand">${first ? "Set your password" : "Change password"}</div>
    <p class="sub">${first ? "Use this from now on instead of the server key." : "Other signed-in browsers will be signed out."}</p>
    <input id="pc" type="password" placeholder="${first ? "Server key (from the .env)" : "Current password"}" autocomplete="current-password" required>
    <input id="pn" type="password" placeholder="New password (10+ characters)" autocomplete="new-password" minlength="10" required>
    <input id="pr" type="password" placeholder="New password again" autocomplete="new-password" minlength="10" required>
    <div class="row" style="display:flex;gap:8px"><button class="btn primary">Save</button><button class="btn" type="button" id="px">Cancel</button></div>
    <div class="err" id="pe"></div></form>`;
  document.body.appendChild(box);
  box.querySelector("#px").onclick = () => box.remove();
  box.querySelector("#pf").onsubmit = async (e) => {
    e.preventDefault();
    const [cur, nw, again] = ["#pc", "#pn", "#pr"].map((s) => box.querySelector(s).value);
    if (nw !== again) return (box.querySelector("#pe").textContent = "The new passwords don't match.");
    try {
      await api("/v1/admin/password", { method: "POST", body: JSON.stringify({ current: cur, new: nw }) });
      box.remove(); store.set(""); key = ""; login("Password saved. Sign in with it.");
    } catch (err) { if (err.message !== "unauthorized") box.querySelector("#pe").textContent = err.message; }
  };
}

function followUp(p) {
  const hi = `Hi ${p.contact ? p.contact.split(/[ ,]/)[0] : p.company + " team"}! `;
  return {
    "link sent": hi + `Did you get a chance to try Squidbrake? It takes about 2 minutes, everything is here:\n${p.link}`,
    "opened link": hi + `Saw you opened the Squidbrake setup page. Anything that got in the way? Happy to do a quick 5-minute call and set it up together.\n${p.link}`,
    "keys taken": hi + `Your dashboard is ready, the last bit is connecting Claude Code: step 2 on ${p.link} (one command), then restart Claude Code. Want me to walk you through it?`,
    "installed": hi + `You're all set up! Restart Claude Code if you haven't, then try asking it to print your .env file: Squidbrake should block it.`,
    "quiet": hi + `Haven't seen activity from Squidbrake in a few days. Was something annoying, like too many approvals? I can tune the rules for you, or switch it to shadow mode (it just records what it would block).`,
    "active": hi + `How's Squidbrake working for you so far? Anything it held that it shouldn't have, or something it should have caught? 2 minutes of feedback would help a lot.`,
  }[p.stage];
}

function message(company, link, hosted) {
  if (hosted) return `Hi ${company} team! Here's Squidbrake, the brake for AI coding agents I mentioned.\n\n` +
    `It checks every action your agent (Claude Code, Cursor, Antigravity...) takes before it runs: reading runs on its own, ` +
    `changes wait for one click (on your phone too), and dangerous stuff (wiping folders, printing .env, dropping tables) is blocked.\n\n` +
    `I've set up your own dashboard, so there's nothing to run on your laptop. Setup is ~2 minutes, everything is on this page:\n${link}\n\n` +
    `Would love your honest feedback after a few days of real work!`;
  return `Hi ${company} team! Here's Squidbrake, the brake for AI coding agents I mentioned.\n\n` +
    `It checks every action your agent (Claude Code, Cursor, Antigravity...) takes before it runs: reading runs on its own, ` +
    `changes wait for one click, and dangerous stuff (wiping folders, printing .env, dropping tables) is blocked. ` +
    `It runs on your machine.\n\nSetup is ~3 minutes, everything is on this page:\n${link}\n\n` +
    `It shares only usage counts with me (never your code or commands), so I can see what helps. ` +
    `Would love your honest feedback after a few days of real work!`;
}

async function load() {
  if (!key) return login();
  let d, me, asks;
  try { [d, me, asks] = await Promise.all([api("/v1/admin/overview"), api("/v1/admin/me"), api("/v1/admin/team-requests")]); }
  catch (e) { if (e.message !== "unauthorized") app.innerHTML = `<p class="err">${esc(e.message)}</p>`; return; }
  const w = d.week;
  app.innerHTML = `
    <header><div class="brand">Squid<span>brake</span> <small>Insights</small></div><span class="spacer"></span>
      <button class="btn" id="refresh">↻ Refresh</button><button class="btn" id="pw">${me.has_password ? "Change password" : "Set password"}</button>
      <button class="btn" id="logout">Log out</button></header>
    ${me.has_password ? "" : `<div class="panel" style="padding:12px 16px;border-color:var(--warn)"><b>Set your own password</b>
      <span class="sub">so you don't have to use the server key.</span> <button class="btn" id="pw2">Set password</button></div>`}
    <section class="panel"><h2>This week <button class="btn" style="margin-left:auto" data-copy="${esc(weeklyReport(d))}">Copy weekly report</button></h2>
      <div class="cards" style="padding:14px 16px 0;margin-bottom:10px">
        ${card("Active today", d.scorecard.active_today)}${card("Active this week", d.scorecard.active_this_week)}
        ${card("3+ days this week", d.scorecard.active_3_plus_days)}
        ${cardText("Back from last week", `${d.scorecard.retained} of ${d.scorecard.active_last_week}`)}
        ${card("Held for a person", w.held)}${card("Blocked", w.blocked)}
        ${cardText("Holds approved", d.scorecard.approve_rate === null ? "–" : d.scorecard.approve_rate + "%",
                   d.scorecard.approve_rate > 90 ? "Over 90%: the rules hold things people are fine with" : "")}
        ${cardText("At risk / churned", `${d.scorecard.at_risk} / ${d.scorecard.churned}`,
                   d.scorecard.at_risk + d.scorecard.churned ? "No activity for 3+ days (at risk) or 7+ days (churned)" : "")}
        ${cardText("Stopped (rejected or blocked)", String(d.scorecard.stopped), savedText(d.scorecard.saved))}
      </div>
      <div class="sub" style="padding:0 16px 14px">${d.pilots.length} pilots · ${d.installs} installs · ${w.events.toLocaleString()} actions this week${w.would_block ? ` · ${w.would_block} would block (shadow)` : ""}</div>
    </section>
    ${teamPanel(asks)}
    <section class="panel"><h2>New pilot</h2>
      <form class="new" id="nf"><input id="nc" placeholder="Company (e.g. Acme)" required maxlength="80">
        <input id="nk" placeholder="Contact (name, email, phone)" maxlength="120">
        <input id="nn" placeholder="Note (how you met, what they build)" maxlength="500">
        <button class="btn primary">Create link</button>
        <label class="hosted-opt"><input type="checkbox" id="nh" checked> <b>Hosted</b>: their own dashboard at
          <i>name</i>.app.squidbrake.com, nothing to keep running on their laptop (uncheck for the private setup: everything on their machine)</label></form>
      <div class="result" id="res"></div>
    </section>
    <section class="panel"><h2>Pilots</h2>
      ${d.pilots.length ? `<div class="table-wrap"><table><thead><tr><th>Company</th><th>Stage</th><th>Last 14 days</th>
        <th>7 days</th><th>Agents</th><th>What fired</th><th></th></tr></thead><tbody>${d.pilots.map(row).join("")}</tbody></table></div>`
        : `<div class="empty">No pilots yet. Create a link above and send it to a founder.</div>`}
    </section>
    <p class="sub">Counts, and for held or blocked actions only the program, rule, outcome and sizes: Squidbrake never sends commands' arguments, file names, code, prompts or tool inputs here. Hosted dashboards report every 2 minutes; this page refreshes every minute.</p>`;
  document.getElementById("refresh").onclick = load;
  document.getElementById("logout").onclick = async () => {
    await fetch("/v1/admin/logout", { method: "POST", headers: { "X-Admin-Key": key } }).catch(() => {});
    store.set(""); key = ""; login();
  };
  document.getElementById("pw").onclick = () => passwordDialog(!me.has_password);
  document.getElementById("pw2")?.addEventListener("click", () => passwordDialog(true));
  document.getElementById("nf").onsubmit = create;
  document.querySelectorAll("[data-del]").forEach((b) => b.onclick = async () => {
    if (!confirm(b.dataset.warn)) return;
    await api(`/v1/admin/pilots/${encodeURIComponent(b.dataset.del)}`, { method: "DELETE" }); load();
  });
  document.querySelectorAll("[data-copy]").forEach((b) => b.onclick = () => copy(b.dataset.copy, b));
  document.querySelectorAll("[data-done]").forEach((b) => b.onclick = async () => {
    await api(`/v1/admin/team-requests/${b.dataset.done}`, { method: "POST", body: JSON.stringify({ done: b.dataset.to === "1" }) });
    load();
  });
}

// Teams that filled in /team (from `connect all`, the dashboard, or a shared link): people who installed on their own
const FROM = { cli: "connect all", dashboard: "dashboard", github: "GitHub", site: "website" };
function teamPanel(asks) {
  const open = asks.filter((a) => !a.done);
  const rows = asks.slice(0, 50).map((a) => `<tr${a.done ? ' style="opacity:.55"' : ""}>
    <td><b>${esc(a.name)}</b><div class="mini"><a href="mailto:${esc(a.email)}">${esc(a.email)}</a></div></td>
    <td>${esc(a.company || "–")}<div class="mini">${a.team_size ? esc(a.team_size) + " people" : ""}</div></td>
    <td>${esc(a.agents || "–")}</td><td style="max-width:340px;white-space:pre-wrap">${esc(a.note || "")}</td>
    <td>${esc(FROM[a.source] || a.source || "–")}<div class="mini">${ago(a.created_at)}</div></td>
    <td><button class="btn" data-done="${a.id}" data-to="${a.done ? 0 : 1}">${a.done ? "Reopen" : "Mark replied"}</button></td></tr>`).join("");
  return `<section class="panel"${open.length ? ' style="border-color:var(--accent)"' : ""}><h2>Teams asking for help
      ${open.length ? `<span class="sub">${open.length} waiting for a reply</span>` : ""}
      <a class="btn" style="margin-left:auto" href="/team" target="_blank" rel="noopener">Open the form</a></h2>
    ${asks.length ? `<div class="table-wrap"><table><thead><tr><th>Who</th><th>Company</th><th>Agents</th><th>Note</th>
      <th>From</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`
      : `<div class="empty">Nobody yet. The form is linked from <code>connect all</code> and the dashboard's Team page.</div>`}
  </section>`;
}

const card = (k, v) => `<div class="card"><div class="k">${k}</div><div class="v">${Number(v || 0).toLocaleString()}</div></div>`;
const cardText = (k, v, warn = "") => `<div class="card"${warn ? ` title="${esc(warn)}" style="border-color:var(--warn)"` : ""}><div class="k">${k}</div><div class="v">${esc(v)}</div>${warn ? `<div class="mini">${esc(warn)}</div>` : ""}</div>`;

// What to send a cofounder or an investor every week: usage, not output
function weeklyReport(d) {
  const s = d.scorecard, w = d.week, day = new Date().toISOString().slice(0, 10);
  const lines = [`Squidbrake pilots, week to ${day}`,
    `Active today: ${s.active_today} · this week: ${s.active_this_week} · 3+ days this week: ${s.active_3_plus_days} (of ${d.pilots.length} pilots, ${d.installs} installs)`,
    `Back from last week: ${s.retained} of ${s.active_last_week}`,
    `Actions: ${w.events} · held for a person: ${w.held} (approved ${w.approved}, rejected ${w.rejected}) · blocked: ${w.blocked}`,
    `Holds approved: ${s.approve_rate === null ? "none decided yet" : s.approve_rate + "%"}`, "", "Per pilot:"];
  for (const p of d.pilots) lines.push(`- ${p.company}: active ${p.days_this_week}/7 days, ${p.week.events} actions, ${p.week.held} held, ${p.week.blocked} blocked (${p.stage})`);
  return lines.join("\n");
}

function row(p) {
  const [label, cls] = STAGE[p.stage] || [p.stage, "s-sent"];
  const max = Math.max(1, ...p.daily);
  const spark = `<div class="spark" title="Actions per day, last 14 days">${p.daily.map((v) => `<i style="height:${Math.max(1, (v / max) * 34)}px" title="${v}"></i>`).join("")}</div>`;
  const w = p.week;
  const agents = Object.entries(p.agents).map(([a, n]) => `<span class="chip">${esc(a)} · ${n}</span>`).join("") || `<span class="sub">none yet</span>`;
  const hits = Object.entries(p.rules_hit).map(([r, n]) => `<span class="chip r">${esc(r)} · ${n}</span>`).join("") || `<span class="sub">nothing</span>`;
  return `<tr><td><div class="co">${esc(p.company)}</div><div class="sub">${esc(p.contact || "")}</div>
      <div class="sub">${esc(p.note || "")}</div><div class="mini">code <b>${esc(p.code)}</b> · link opened ${p.page_views}×</div>
      ${p.hosted ? `<div class="mini">hosted: <a href="${esc(p.dashboard)}" target="_blank" rel="noopener">${esc((p.dashboard || "").replace("https://", ""))}</a></div>
      <div class="mini">${p.keys_revealed_at ? "keys shown " + ago(p.keys_revealed_at) : p.keys_waiting ? "keys waiting on their page" : ""}${p.error ? `<span style="color:var(--accent)"> · ${esc(p.error)}</span>` : ""}</div>` : ""}</td>
    <td><span class="stage ${cls}">${label}</span> ${healthBadge(p)}<div class="mini">last seen ${ago(p.last_seen)}</div>
      <div class="mini">${p.installs} install${p.installs === 1 ? "" : "s"}${p.versions.length ? " · v" + esc(p.versions.join(", ")) : ""}${p.modes.includes("shadow") ? " · shadow" : ""}</div></td>
    <td>${spark}<div class="mini"><b>${p.total_events.toLocaleString()}</b> actions all time</div></td>
    <td class="num"><div><b>${w.events}</b> actions</div><div class="mini">${w.held} held · ${w.approved} approved · ${w.rejected} rejected</div>
      <div class="mini">${w.blocked} blocked${w.would_block ? ` · ${w.would_block} would block` : ""}${w.timed_out ? ` · ${w.timed_out} timed out` : ""}</div>
      ${p.stopped ? `<div class="mini"><b>stopped ${p.stopped}</b>${savedText(p.saved) ? " · saved " + esc(savedText(p.saved)) : ""}</div>` : ""}
      ${p.decide_median_s !== null && p.decide_median_s !== undefined ? `<div class="mini">decided in ${fmtSecs(p.decide_median_s)} (median)</div>` : ""}
      ${p.trend !== null && p.trend !== undefined ? `<div class="mini">${p.trend >= 0 ? "▲" : "▼"} ${Math.abs(p.trend)}% vs last week</div>` : ""}</td>
    <td>${agents}</td><td>${hits}</td>
    <td>${followUp(p) ? `<button class="btn" data-copy="${esc(followUp(p))}" title="A message for where they are now">Copy follow-up</button>` : ""}
      <button class="btn" data-copy="${esc(p.link)}">Copy link</button>
      <button class="icon-btn" title="Delete pilot" data-del="${esc(p.code)}" data-warn="${esc(deleteWarning(p))}">✕</button></td></tr>
    ${p.catches && p.catches.length ? `<tr class="catches"><td colspan="7"><details><summary>What it held or blocked (${p.catches.length})</summary>
      <table class="inner"><thead><tr><th>When</th><th>Agent</th><th>Action</th><th>Why</th><th>Outcome</th><th>Would have changed</th><th>Decided in</th></tr></thead>
      <tbody>${p.catches.map(catchRow).join("")}</tbody></table>
      <div class="mini">The program only (never its arguments, files or prompts), the rule's reason, and sizes as numbers.</div></details></td></tr>` : ""}`;
}

const HEALTH = { "active": ["", ""], "at risk": ["At risk", "var(--warn)"], "churned": ["Churned", "var(--accent)"], "not started": ["", ""] };
function healthBadge(p) {
  const [label, color] = HEALTH[p.health] || ["", ""];
  return label ? `<span class="mini" style="color:${color};font-weight:600" title="No activity for ${p.idle_days} days">${label} · ${p.idle_days}d idle</span>` : "";
}
const savedText = (s) => Object.entries(s || {}).map(([k, v]) => `${Number(v).toLocaleString()} ${v === 1 ? k.replace(/s$/, "") : k}`).join(", ");
const fmtSecs = (s) => s < 60 ? `${s}s` : s < 3600 ? `${Math.round(s / 60)} min` : `${Math.round(s / 3600)} h`;
const OUTCOME = { approved: "var(--ok, #2e7d32)", rejected: "var(--accent)", blocked: "var(--accent)", "timed out": "var(--warn)", waiting: "var(--warn)" };
function catchRow(x) {
  const action = x.program ? `<code>${esc(x.program)}</code>${x.category ? ` <span class="mini">${esc(x.category)}</span>` : ""}` : `<code>${esc(x.tool || "")}</code>`;
  return `<tr><td class="mini">${esc(x.t.replace("T", " "))}</td><td>${esc(x.agent || "")}</td><td>${action}</td>
    <td>${esc(x.why || "")}<div class="mini">${esc(x.rule || "")}</div></td>
    <td style="color:${OUTCOME[x.outcome] || "inherit"};font-weight:600">${esc(x.outcome || "")}</td>
    <td>${esc(savedText(x.saved)) || '<span class="mini">–</span>'}</td><td class="mini">${x.decide_s !== undefined ? fmtSecs(x.decide_s) : "–"}</td></tr>`;
}

// Deleting a hosted pilot switches its dashboard off, and Squidbrake fails closed: their agents stop until they remove it
function deleteWarning(p) {
  const base = `Delete the pilot ${p.company} (${p.code}) and its stats? Its link stops working.`;
  if (!p.hosted) return `${base}

Their own Squidbrake keeps working; it just stops sending usage counts here.`;
  const connected = p.installs > 0 || p.keys_revealed_at;
  return `${base}

Their hosted dashboard is switched off and its data deleted.` + (connected
    ? `

THEIR AGENTS WILL STOP WORKING: Squidbrake blocks everything when its dashboard is gone. Ask them to run this first:

squidbrake connect all --remove`
    : "");
}

async function create(e) {
  e.preventDefault();
  const company = document.getElementById("nc").value.trim();
  const r = await api("/v1/admin/pilots", { method: "POST", body: JSON.stringify({ company,
    contact: document.getElementById("nk").value.trim(), note: document.getElementById("nn").value.trim(),
    hosted: document.getElementById("nh").checked }) });
  const msg = message(company, r.link, !!r.dashboard);
  await load();                                   // the new pilot shows in the table; then show its link
  const res = document.getElementById("res");
  res.style.display = "block";
  res.innerHTML = `<div><b>Link for ${esc(company)}:</b> <a href="${esc(r.link)}" target="_blank" rel="noopener">${esc(r.link)}</a></div>
    <p class="sub">A message you can send (edit as you like):</p><textarea id="msg">${esc(msg)}</textarea>
    <div class="row"><button class="btn primary" id="cm">Copy message</button><button class="btn" id="cl">Copy link</button>
    <a class="btn" href="https://wa.me/?text=${encodeURIComponent(msg)}" target="_blank" rel="noopener">Open in WhatsApp</a></div>`;
  document.getElementById("cm").onclick = (ev) => copy(document.getElementById("msg").value, ev.target);
  document.getElementById("cl").onclick = (ev) => copy(r.link, ev.target);
}

async function copy(text, btn) {
  try { await navigator.clipboard.writeText(text); const t = btn.textContent; btn.textContent = "Copied"; setTimeout(() => (btn.textContent = t), 1400); }
  catch { prompt("Copy this:", text); }
}

load();
setInterval(() => { if (key && !document.getElementById("res")?.style.display.includes("block")) load(); }, 60000);
</script>
